[package]
name = "haf-cargo-affected"
version = "0.1.0"
description = "Cargo subcommand that lists workspace crates affected by a change"
license = "WTFPL"
edition = "2024"
repository = "https://github.com/huuff/cargo-affected"
readme = "README.md"
keywords = ["cargo", "subcommand", "workspace", "monorepo", "ci"]
categories = ["development-tools::cargo-plugins"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[lib]
name = "cargo_affected"
path = "src/lib.rs"

[[bin]]
name = "cargo-affected"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
tempfile = "3"
